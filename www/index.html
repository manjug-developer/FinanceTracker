<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Finance Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Finance Dashboard</h1>
    </header>

    <div class="container">
        <div class="widgets">
            <div class="widget">
                <h3>Total Earning</h3>
                <p id="totalEarning">0</p>
            </div>
            <div class="widget">
                <h3>Total Spend</h3>
                <p id="totalSpent">0</p>
            </div>
            <div class="widget">
                <h3>Balance</h3>
                <p id="balance">0</p>
            </div>
        </div>

        <div style="text-align:center;">
            <button onclick="window.location.href='form.html'">Enter New Record</button>
            <button onclick="window.location.href='records.html'">View All Records</button>
        </div>
    </div>

    <script src="cordova.js"></script>
    <script src="js/db.js"></script>
    <script src="js/home.js"></script>
</body>
</html>
